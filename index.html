<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8fbd" />
  <title>Puppy Panel</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <template id="login-template">
    <main class="login-shell">
      <section class="login-card glass">
        <div class="heart-badge">♡</div>
        <h1 data-copy="appTitle">Puppy Panel</h1>
        <p class="muted">A cozy little world for two.</p>
        <div class="login-grid">
          <button class="role-card owner-card" data-login-role="owner">
            <span class="role-emoji">🎀</span>
            <strong data-copy="ownerLabel">Owner Panel</strong>
            <small>Manage tasks, rewards, themes & more</small>
          </button>
          <button class="role-card puppy-card" data-login-role="puppy">
            <span class="role-emoji">🐾</span>
            <strong data-copy="puppyLabel">Puppy Panel</strong>
            <small>Check in, earn treats & keep memories</small>
          </button>
        </div>
        <div class="demo-note">Demo login: choose either panel. Add Firebase later for private accounts.</div>
      </section>
    </main>
  </template>

  <template id="shell-template">
    <div class="app-shell">
      <header class="topbar glass">
        <div>
          <span class="eyebrow" id="role-eyebrow"></span>
          <h1 id="page-title">Home</h1>
        </div>
        <div class="top-actions">
          <button class="icon-btn" data-action="toggle-night" title="Toggle night mode">☾</button>
          <button class="avatar" data-route="profile">🐶</button>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav class="bottom-nav glass" id="bottom-nav"></nav>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
