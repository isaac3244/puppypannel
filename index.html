<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8fbd" />
  <title>Puppy Panel</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <template id="login-template">
    <main class="login-shell">
      <section class="login-card glass">
        <div class="heart-badge">♡</div>
        <h1 data-copy="appTitle">Puppy Panel</h1>
        <p class="muted">A cozy little world for two.</p>
        <div class="login-grid" id="role-chooser">
          <button class="role-card owner-card" data-select-role="owner">
            <span class="role-emoji">🎀</span>
            <strong data-copy="ownerLabel">Owner Panel</strong>
            <small>Manage tasks, rewards, themes & more</small>
          </button>
          <button class="role-card puppy-card" data-select-role="puppy">
            <span class="role-emoji">🐾</span>
            <strong data-copy="puppyLabel">Puppy Panel</strong>
            <small>Check in, earn treats & keep memories</small>
          </button>
        </div>
        <form id="login-form" class="stack" style="display:none;margin-top:22px;text-align:left">
          <div class="row"><button type="button" class="btn secondary small" id="back-to-roles">← Back</button><span class="pill" id="selected-role-label"></span></div>
          <label>Email<input class="input" id="login-email" type="email" autocomplete="email" required></label>
          <label>Password<input class="input" id="login-password" type="password" autocomplete="current-password" required></label>
          <button class="btn" type="submit">Sign in</button>
          <div id="login-error" class="notice" style="display:none"></div>
        </form>
        <div class="demo-note">Secure Firebase login. Cloud photo uploads are disabled in this free version.</div>
      </section>
    </main>
  </template>

  <template id="shell-template">
    <div class="app-shell">
      <header class="topbar glass">
        <div>
          <span class="eyebrow" id="role-eyebrow"></span>
          <h1 id="page-title">Home</h1>
        </div>
        <div class="top-actions">
          <button class="icon-btn" data-action="toggle-night" title="Toggle night mode">☾</button>
          <button class="avatar" data-route="profile">🐶</button>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav class="bottom-nav glass" id="bottom-nav"></nav>
    </div>
  </template>

  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
